# Publie le site de MC Cuisine sur GitHub Pages (domaine mc-cuisine.fr) à chaque push sur main.
# Le site en ligne est la direction H : son dossier site/h passe à la racine, avec seulement
# les images et vidéos qu'il utilise. Les autres directions (a à i) restent dans le dépôt, hors ligne.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assembler le site de production
        run: bash scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
